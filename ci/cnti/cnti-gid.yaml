# Linkerd's control plane on its chart defaults, plus only the group ids; the
# identity certificates come from the workflow.
---
config_version: "v2"
deployments:
  helm_charts:
    - name: linkerd-crds
      helm_repo_name: linkerd-edge
      helm_repo_url: https://helm.linkerd.io/edge
      helm_chart_name: linkerd-crds
      chart_version: 2026.10.1
      namespace: linkerd
      priority: 2
    - name: linkerd-control-plane
      helm_repo_name: linkerd-edge
      helm_repo_url: https://helm.linkerd.io/edge
      helm_chart_name: linkerd-control-plane
      chart_version: 2026.10.1
      namespace: linkerd
      priority: 3
      helm_values: >-
        --values ci/cnti/values-gid.yaml
        --set-file identityTrustAnchorsPEM=ci/cnti/certs/ca.crt
        --set-file identity.issuer.tls.crtPEM=ci/cnti/certs/issuer.crt
        --set-file identity.issuer.tls.keyPEM=ci/cnti/certs/issuer.key
