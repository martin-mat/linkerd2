# Values for the CNTi Test Suite run (.github/workflows/cnti.yml): resource
# requests and limits on every control-plane container and on the injected
# proxies, and a group id next to the chart's user ids (the chart omits it by
# default). The identity certificates are generated by the workflow and
# passed with --set-file.
controllerGID: 2103
proxy:
  gid: 2102
  resources:
    cpu: {request: 50m, limit: 500m}
    memory: {request: 32Mi, limit: 256Mi}
proxyInit:
  resources:
    cpu: {request: 10m, limit: 100m}
    memory: {request: 10Mi, limit: 64Mi}
policyController:
  resources:
    cpu: {request: 50m, limit: 500m}
    memory: {request: 32Mi, limit: 256Mi}
destinationResources: &controller
  cpu: {request: 50m, limit: 500m}
  memory: {request: 32Mi, limit: 256Mi}
identityResources: *controller
proxyInjectorResources: *controller
spValidatorResources: *controller
# The heartbeat CronJob reads this too, although values.yaml does not list it.
heartbeatResources: *controller
